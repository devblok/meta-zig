# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# Only the private native toolchain and Zig consumers are qualified here.
# Keep the old clang target/SDK suite and broad bbappend dormant on Wrynose.
BBFILES += " \
    ${LAYERDIR}/recipes-devtools/zig-llvm/zig-llvm-native_*.bb \
    ${LAYERDIR}/recipes-devtools/zig/zig-native_*.bb \
    ${LAYERDIR}/recipes-examples/*/*.bb \
"

BBFILE_COLLECTIONS += "zig"
BBFILE_PATTERN_zig := "^${LAYERDIR}/"
BBFILE_PRIORITY_zig = "6"
LAYERSERIES_COMPAT_zig = "wrynose"
LAYERDEPENDS_zig = "core clang-layer"

# Default Zig version
ZIGVERSION ??= "0.16.0"

# Version variables for recipes
ZIG_MAJOR_VER ??= "0"
ZIG_MINOR_VER ??= "16"
ZIG_PATCH_VER ??= "0"

# Zig's pinned source needs LLVM/Clang/LLD 21. The zig-llvm-native recipe
# supplies it privately; ordinary clang/LLVM providers remain untouched.
