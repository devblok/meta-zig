# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb ${LAYERDIR}/recipes*/*/*.bbappend"

BBFILE_COLLECTIONS += "zig"
BBFILE_PATTERN_zig := "^${LAYERDIR}/"
BBFILE_PRIORITY_zig = "6"
LAYERSERIES_COMPAT_zig = "scarthgap styhead walnascar"
LAYERDEPENDS_zig = "core clang-layer"

# Default Zig version
ZIGVERSION ??= "0.16.0"

# Version variables for recipes
ZIG_MAJOR_VER ??= "0"
ZIG_MINOR_VER ??= "16"
ZIG_PATCH_VER ??= "0"

# Zig 0.16 statically links LLVM/clang/lld 21 (its CMakeLists does
# find_package(llvm/clang/lld 21)). kraj's meta-clang has no scarthgap branch
# at LLVM 21, so this layer vendors an LLVM-21 standalone clang recipe (based
# on meta-clang walnascar, bumped to 21.1.8). Select it here for clang-native
# while meta-clang stays pinned to kraj scarthgap-clang20 (LLVM 20.1.1).
PREFERRED_VERSION_clang = "21.1.8%"
PREFERRED_VERSION_clang-native = "21.1.8%"
